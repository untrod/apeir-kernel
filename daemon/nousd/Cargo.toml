[package]
name = "nousd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "APEIR Kernel daemon"

[features]
fault-injection = ["nous-kernel-core/fault-injection"]

[[bin]]
name = "nousd"
path = "src/main.rs"

[[bin]]
name = "apeird"
path = "src/bin/apeird.rs"

[dependencies]
chrono.workspace = true
nous-control-plane.workspace = true
nous-kernel-core.workspace = true
nous-nki.workspace = true
nous-state.workspace = true
nous-types.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
